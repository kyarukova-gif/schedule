name = "photo-booking"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
# Адрес, где лежит страница записи (без слэша на конце)
SITE_URL = "https://REPLACE_ME.github.io/schedule/booking"
ALLOWED_ORIGIN = "https://REPLACE_ME.github.io"
# Почта для писем о записях задаётся секретом: npx wrangler secret put NOTIFY_EMAIL

[[kv_namespaces]]
binding = "SLOTS"
id = "REPLACE_WITH_KV_ID"   # npx wrangler kv namespace create SLOTS
