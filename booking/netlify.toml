[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Почта фотографа намеренно публична (условия, контакты), её не нужно считать утечкой
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER,NOTIFY_EMAIL"

# Папка с документацией лежит рядом с сайтом, но из интернета не открывается
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
