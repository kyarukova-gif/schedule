<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marché de Noël · Nice — фотосессия</title>
<meta name="description" content="Экспресс-фотосессия на Marché de Noël в Ницце. 30 минут, до 100 кадров.">
<meta name="theme-color" content="#0d261d">
<style>
  :root{
    --night:#0d261d; --night2:#17402f; --cream:#fbf4e2; --ink:#1d2a24; --mute:#6d746f;
    --gold:#e0b25a; --gold-d:#b8892f; --red:#c8423a; --green:#14382b; --line:#e8dcc0; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--night);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding-bottom:calc(120px + env(safe-area-inset-bottom));
       background-image:radial-gradient(circle at 20% 10%,rgba(224,178,90,.08),transparent 40%),radial-gradient(circle at 90% 60%,rgba(200,66,58,.07),transparent 45%)}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}
  .serif{font-family:Georgia,"Times New Roman",serif}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;color:var(--cream);text-align:center;padding:100px 16px 38px;
        background:linear-gradient(180deg,#071812 0%,var(--night2) 100%)}
  #snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .garland{position:absolute;left:0;right:0;top:0;height:46px;display:flex;justify-content:space-around;padding:0 4px;pointer-events:none}
  .garland::before{content:"";position:absolute;left:-10px;right:-10px;top:-18px;height:40px;border-bottom:2px solid #5b4a22;border-radius:0 0 50% 50%/0 0 100% 100%}
  .bulb{position:relative;top:10px;width:10px;height:15px;border-radius:50% 50% 55% 55%;animation:tw 2.4s ease-in-out infinite}
  .bulb::before{content:"";position:absolute;left:2px;top:-4px;width:6px;height:5px;background:#5b4a22;border-radius:2px}
  .bulb:nth-child(4n+1){background:var(--gold);box-shadow:0 0 12px 3px rgba(224,178,90,.7)}
  .bulb:nth-child(4n+2){background:#ff6b5e;box-shadow:0 0 12px 3px rgba(255,107,94,.65);animation-delay:.6s}
  .bulb:nth-child(4n+3){background:#fff3d1;box-shadow:0 0 12px 3px rgba(255,243,209,.6);animation-delay:1.2s}
  .bulb:nth-child(4n){background:#7ed9a4;box-shadow:0 0 12px 3px rgba(126,217,164,.6);animation-delay:1.8s}
  .bulb:nth-child(even){top:16px}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
  .eyebrow{position:relative;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  .hero h1{position:relative;margin:6px 0 4px;font:italic 600 40px/1.05 Georgia,"Times New Roman",serif}
  .hero h1 small{display:block;font:600 14px/1.4 -apple-system,sans-serif;font-style:normal;letter-spacing:.3em;text-transform:uppercase;margin-top:8px;color:#f3e7c3}
  .hero p{position:relative;margin:14px auto 0;max-width:380px;opacity:.9}
  .pills{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .pill{background:rgba(255,255,255,.1);border:1px solid rgba(224,178,90,.45);padding:6px 12px;border-radius:99px;font-size:14px}
  .lang{position:absolute;right:12px;top:54px;display:flex;gap:4px;z-index:2}
  .lang button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--cream);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit}
  .lang button.on{background:var(--cream);color:var(--green)}

  /* ---------- sections ---------- */
  section{margin-top:26px}
  h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#f1e3bd;margin:0 0 10px;font-weight:600}
  h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3b2a05;margin-right:8px;font-size:12px;letter-spacing:0;font-weight:700}
  h2 .opt{text-transform:none;letter-spacing:0;font-weight:400;opacity:.7;margin-left:6px}
  .card{background:var(--cream);border-radius:var(--radius);padding:16px}

  .inc{list-style:none;margin:0;padding:0}
  .inc li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
  .inc li+li{border-top:1px dashed var(--line)}
  .inc .ic{font-size:22px;line-height:1.2;flex:none;width:28px;text-align:center}

  .days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .day{background:var(--cream);border:2px solid transparent;border-radius:var(--radius);padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
  .day .wd{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
  .day .d{font:600 28px/1.1 Georgia,serif;margin:2px 0}
  .day .m{font-size:13px;color:var(--mute)}
  .day .left{font-size:11px;margin-top:6px;color:var(--green)}
  .day.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,178,90,.35)}
  .day.full{opacity:.4}
  .place{margin:10px 2px 0;font-size:14px;color:#f1e3bd}
  .daynote{margin:8px 2px 0;font-size:14px;color:#f1e3bd;opacity:.9}
  .daynote a{color:var(--gold)}

  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .slot{background:var(--cream);border:2px solid transparent;border-radius:14px;padding:13px 0;font-family:inherit;font-weight:600;font-size:16px;color:var(--ink);cursor:pointer;text-align:center}
  .slot.on{background:var(--red);color:#fff}
  .slot:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
  .hint{color:#f1e3bd;font-size:14px;padding:14px;text-align:center;border:1px dashed rgba(224,178,90,.5);border-radius:14px}


  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:#f1e3bd;margin:0 0 5px 2px}
  .field input{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:14px;border:2px solid transparent;background:var(--cream);color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--gold)}
  .field input.bad{border-color:#ff7b6e}

  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
  .row.big{font-weight:700;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
  .row .k{color:var(--mute)}
  .row > span:last-child{white-space:nowrap}
  .sel{font-weight:600;text-align:right}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
  .check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--green)}
  .check.bad{color:var(--red)}
  .cinfo{font-size:13px;color:var(--mute);margin:12px 0 0}
  .site{position:absolute;left:14px;top:58px;z-index:2;color:var(--gold);font-size:12px;text-decoration:none}
  .info{display:flex;gap:10px;background:rgba(224,178,90,.14);border:1px solid rgba(224,178,90,.4);color:#f3e7c3;padding:12px 14px;border-radius:14px;font-size:14px;margin-top:12px}

  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--night) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom));z-index:5}
  .btn{display:block;width:100%;max-width:520px;margin:0 auto;border:0;border-radius:16px;padding:17px;font-family:inherit;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(180deg,#d4503f,#b53228);cursor:pointer;box-shadow:0 8px 22px rgba(200,66,58,.4)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55}
  .secure{text-align:center;font-size:12px;color:#f1e3bd;opacity:.75;margin-top:8px}
  footer{margin:28px 0 0;text-align:center;font-size:13px;color:#f1e3bd;opacity:.85}
  footer a{color:inherit}
  .check a{color:var(--green);font-weight:600}
  .toast{position:fixed;left:16px;right:16px;bottom:110px;max-width:488px;margin:0 auto;background:#fff;color:#222;padding:12px 14px;border-radius:12px;font-size:14px;z-index:9;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .who{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:24px;line-height:1;color:var(--green);cursor:pointer;font-family:inherit}
  .stepper button:disabled{opacity:.35}
  .stepper b{min-width:38px;text-align:center;font:600 24px Georgia,serif}
  .pkgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .pkg{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
  .pkg .pm{font:600 22px Georgia,serif}
  .pkg .pp{font-size:18px;font-weight:700;margin:2px 0;color:var(--red)}
  .pkg .pd{font-size:12px;color:var(--mute)}
  .pkg.on{border-color:var(--gold);background:#fff8e6;box-shadow:0 0 0 3px rgba(224,178,90,.35)}
  .tip{margin-top:12px;background:#fff3d1;border:1px solid #e8cf8a;border-radius:12px;padding:10px 12px;font-size:14px}
  .tip button{margin-left:6px;border:0;background:var(--green);color:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
  .field textarea{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:14px;border:2px solid transparent;background:var(--cream);color:var(--ink);resize:vertical;min-height:84px}
  .field textarea:focus{outline:none;border-color:var(--gold)}
  [hidden]{display:none !important}
  .gallery{overflow:hidden;padding:14px 0 2px;background:linear-gradient(180deg,var(--night2),var(--night))}
  .gallery[hidden]{display:none}
  .track{display:flex;gap:10px;width:max-content;animation:slide var(--dur,40s) linear infinite}
  .track img{height:230px;width:auto;border-radius:14px;display:block;border:2px solid rgba(224,178,90,.55);background:#10281f}
  .gallery:active .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(calc(-50% - 5px))}}
  @media (prefers-reduced-motion: reduce){ .bulb{animation:none} .gallery{overflow-x:auto} .track{animation:none} }
</style>
</head>

<header class="hero">
  <canvas id="snow"></canvas>

</header>

<div class="gallery" id="gallery" hidden aria-label="Photos"><div class="track" id="track"></div></div>

<main class="wrap">
  <section>
    <div class="card"><ul class="inc" id="inc"></ul></div>
  </section>

  <section>
    <h2><span class="n">1</span><span data-i="stepWho"></span></h2>

      <div class="who"><span data-i="people"></span>
        <div class="stepper"><button type="button" id="pminus" aria-label="-">−</button><b id="pcount">1</b><button type="button" id="pplus" aria-label="+">+</button></div></div>
      <div class="pkgs" id="pkgs"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>

  <section>
    <h2><span class="n">2</span><span data-i="stepDay"></span></h2>
    <div class="days" id="days"></div>
    <div class="place" id="place"></div>
    <p class="daynote" id="daynote"></p>
  </section>

  <section>
    <h2><span class="n">3</span><span data-i="stepTime"></span></h2>
    <div id="slots"></div>
  </section>

  <section>
    <h2><span class="n">4</span><span data-i="stepYou"></span></h2>
    <label class="field"><span data-i="name"></span><input id="name" autocomplete="name"></label>

    <label class="field"><span data-i="phone"></span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+33 6 12 34 56 78"></label>
    <label class="field"><span data-i="wishes"></span><textarea id="wishes" maxlength="400" rows="3" data-ph="wishesPh"></textarea></label>
  </section>

  <section>
    <h2><span class="n">5</span><span data-i="stepPay"></span></h2>
    <div class="card">
      <div class="row"><span class="k" data-i="when"></span><span class="sel" id="sumWhen">—</span></div>
      <div class="row"><span class="k" data-i="people"></span><span id="sumPeople"></span></div>
      <div class="row"><span class="k" data-i="shoot"></span><span id="sumTotal"></span></div>
      <div class="row"><span class="k" data-i="onsite"></span><span id="sumRest"></span></div>
      <div class="row big"><span data-i="payNow"></span><span id="sumDep"></span></div>
      <p class="cinfo" data-i="depositInfo"></p>
      <label class="check" id="agreeBox"><input type="checkbox" id="agree"><span data-ih="agree"></span></label>
    </div>
    <div class="info"><span>🎄</span><span data-i="weather"></span></div>
  </section>

  <footer><span data-i="questions"></span> <a id="igLink" target="_blank" rel="noopener"></a><br><a href="https://katherinegrape.com" target="_blank" rel="noopener">katherinegrape.com</a> · <a href="cgv.html" data-i="legal"></a></footer>
</main>

<div class="bar">
  <button class="btn" id="go"></button>
  <div class="secure" data-i="secure"></div>
</div>
<div class="toast" id="toast"></div>

      btn:"Payer {dep} € et réserver",btnPick:"Choisissez un jour et une heure",
      pickDay:"Choisissez d'abord un jour",left:"{n} libres",full:"complet",
      need:"Indiquez votre prénom",needAgree:"Confirmez les conditions des arrhes",needTime:"Choisissez une heure",
      errInsta:"Vérifiez votre Instagram (ex. @anna)",errPhone:"Vérifiez votre numéro de téléphone",taken:"Ce créneau vient d'être pris — choisissez-en un autre",errNet:"Une erreur est survenue, réessayez",
      paidTitle:"C'est réservé !",paidText:"Arrhes reçues, votre créneau est réservé. Je vous écris sur Instagram ou par téléphone pour confirmer les détails.",paidClose:"Fermer",
      min:"min",wd:["dim","lun","mar","mer","jeu","ven","sam"],mo:["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"],
      moFull:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"]}
  };
  let lang = "ru";
  try{ lang = localStorage.getItem("lang") || (navigator.language||"ru").slice(0,2); }catch(e){}
  if(!T[lang]) lang = "ru";

  const $ = id => document.getElementById(id);
  const fmt = (s, extra) => s.replace(/\{(\w+)\}/g,(_,k)=>({dep:pkg().deposit,rest:pkg().price-pkg().deposit,min:pkg().minutes,price:pkg().price,...extra}[k]));
  const t = (k, extra) => fmt(T[lang][k], extra);

  // ---------- слоты ----------
  const pad = n => String(n).padStart(2,"0");
  const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
  const fromMin = n => pad(Math.floor(n/60))+":"+pad(n%60);
  const STEP = () => C.slotMinutes + (C.bufferMinutes||0);
  // доступные времена начала для выбранного тарифа: 60 мин занимает 2 ячейки сетки
  function slotsFor(day){
    const out=[], mins=pkg().minutes, cells=Math.ceil(mins/STEP());
    for(let m=toMin(day.start); m+mins<=toMin(day.end); m+=STEP()){
      const time=fromMin(m);
      let busy=(day.date+" "+time) <= (C.now||"");
      for(let i=0;i<cells;i++) if(C.taken.includes(day.date+" "+fromMin(m+i*STEP()))) busy=true;
      out.push({time, taken:busy});
    } return out;
  }
  const dObj = ds => { const [y,m,d]=ds.split("-").map(Number); return new Date(y,m-1,d); };

  let selDay = null, selTime = null;

  // ---------- рендер ----------
  function renderLang(){
    $("lang").innerHTML = Object.keys(T).map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
    $("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){};renderAll()});
  }
  function renderStatic(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
    document.querySelectorAll("[data-ih]").forEach(el=>el.innerHTML=t(el.dataset.ih));
    $("pillDur").textContent = "⏱ "+C.packages.map(p=>p.minutes).join(" / ")+" "+T[lang].min;
    $("pillPrice").textContent = C.packages[0].price ? "💶 "+C.packages.map(p=>p.price).join(" / ")+" €" : "";
    document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
    $("inc").innerHTML = [["⏱","inc1"],["📷","inc2"],["✨","inc3"],["🃏","inc4"]].map(([i,k])=>`<li><span class="ic">${i}</span><span>${t(k)}</span></li>`).join("");
    const ig=$("igLink"); ig.textContent=C.instagram?"@"+C.instagram:""; ig.href="https://instagram.com/"+C.instagram;
  }
  function renderDays(){
    $("days").innerHTML = C.days.map(day=>{
      const d=dObj(day.date), free = slotsFor(day).filter(s=>!s.taken).length, full = free===0;
      return `<button class="day ${selDay===day.date?"on":""} ${full?"full":""}" data-d="${day.date}" ${full?"disabled":""}>
        <div class="wd">${T[lang].wd[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="m">${T[lang].mo[d.getMonth()]}</div>
        <div class="left">${full?t("full"):t("left",{n:free})}</div></button>`;
    }).join("");
    $("days").querySelectorAll(".day").forEach(b=>b.onclick=()=>{selDay=b.dataset.d;selTime=null;renderAll()});
    const day = C.days.find(x=>x.date===selDay);
    $("place").textContent = day ? "📍 "+day.place : "";
    $("days").style.gridTemplateColumns = "repeat("+(C.days.length===4||C.days.length===2?2:3)+",1fr)";
    $("daynote").innerHTML = C.instagram ? t("otherDay",{ig:`<a href="https://instagram.com/${C.instagram}" target="_blank" rel="noopener">@${C.instagram}</a>`}) : "";
  }
  function renderSlots(){
    const day = C.days.find(x=>x.date===selDay);
    if(!day){ $("slots").innerHTML = `<div class="hint">${t("pickDay")}</div>`; return; }
    $("slots").innerHTML = `<div class="slots">`+slotsFor(day).map(s=>
      `<button class="slot ${selTime===s.time?"on":""}" data-t="${s.time}" ${s.taken?"disabled":""}>${s.time}</button>`).join("")+`</div>`;
    $("slots").querySelectorAll(".slot").forEach(b=>b.onclick=()=>{selTime=b.dataset.t;renderAll()});
  }
  function whenText(){
    if(!selDay||!selTime) return "—";
    const d=dObj(selDay), end=fromMin(toMin(selTime)+pkg().minutes);
    return `${d.getDate()} ${T[lang].moFull[d.getMonth()]}, ${selTime}–${end}`;
  }
  function renderSummary(){
    $("sumWhen").textContent = whenText();
    $("sumPeople").textContent = people;
    $("sumTotal").textContent = pkg().price+" €";
    $("sumRest").textContent = (pkg().price-pkg().deposit)+" €";
    $("sumDep").textContent = pkg().deposit+" €";
    $("go").textContent = (selDay&&selTime) ? t("btn") : t("btnPick");
  }
  function renderWho(){
    $("pcount").textContent = people;
    $("pminus").disabled = people<=1; $("pplus").disabled = people>=(C.maxPeople||15);
    $("pkgs").innerHTML = C.packages.map((p,i)=>`<button type="button" class="pkg ${i===selPkg?"on":""}" data-p="${i}">
      <div class="pm">${p.minutes} ${T[lang].min}</div><div class="pp">${p.price} €</div><div class="pd">${t(i===0?"pkgDesc0":"pkgDesc1")}</div></button>`).join("");
    $("pkgs").querySelectorAll(".pkg").forEach(b=>b.onclick=()=>{selPkg=+b.dataset.p;renderAll()});
    const big = selPkg===0 && people>(C.recommendedMaxFor30||3) && C.packages.length>1;
    $("tip").hidden = !big;
    if(big){ $("tip").innerHTML = `${t("tip",{n:people})}<button type="button" id="tipBtn">${t("tipBtn")}</button>`;
      $("tipBtn").onclick=()=>{selPkg=C.packages.length-1;renderAll()}; }
  }
  $("pminus").onclick=()=>{ if(people>1){people--;renderAll()} };
  $("pplus").onclick=()=>{ if(people<(C.maxPeople||15)){people++;renderAll()} };
  function renderAll(){
    if(selTime){ const day=C.days.find(x=>x.date===selDay); const ok=day&&slotsFor(day).some(x=>x.time===selTime&&!x.taken); if(!ok) selTime=null; }
    renderLang(); renderStatic(); renderWho(); renderDays(); renderSlots(); renderSummary();
  }

  // ---------- оплата ----------
  function toast(msg){ const el=$("toast"); el.textContent=msg; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none",3200); }

  $("go").onclick = async () => {
    ["name","insta","phone"].forEach(id=>$(id).classList.remove("bad"));
    $("agreeBox").classList.remove("bad");
    if(!selDay || !selTime){ toast(t("needTime")); $("slots").scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const name=$("name").value.trim(), insta=$("insta").value.trim(), phone=$("phone").value.trim();
    const instaOk = /^@?[A-Za-z0-9._]{1,30}$/.test(insta.replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[/?#].*$/,""));
    const phoneOk = /^[+\d][\d\s().-]{5,24}$/.test(phone) && phone.replace(/\D/g,"").length>=7;
    const bad = [!name&&"name", !instaOk&&"insta", !phoneOk&&"phone"].filter(Boolean);
    if(bad.length){
      bad.forEach(id=>$(id).classList.add("bad"));
      toast(bad[0]==="insta"?t("errInsta"):bad[0]==="phone"?t("errPhone"):t("need"));
      $(bad[0]).focus(); return;
    }
    if(!$("agree").checked){ $("agreeBox").classList.add("bad"); toast(t("needAgree")); $("agreeBox").scrollIntoView({behavior:"smooth",block:"center"}); return; }

    $("go").disabled = true;
    try{
      const r = await fetch(API+"/api/checkout",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({date:selDay,time:selTime,minutes:pkg().minutes,people,name,instagram:insta,phone,wishes:$("wishes").value.trim(),lang})});
      const j = await r.json().catch(()=>({}));
      if(r.ok && j.url){ location.href = j.url; return; }
      if(r.status===409){ toast(t("taken")); selTime=null; await load(); $("go").disabled=false; return; }
      if(j.error==="bad_instagram"){ $("insta").classList.add("bad"); toast(t("errInsta")); }
      else if(j.error==="bad_phone"){ $("phone").classList.add("bad"); toast(t("errPhone")); }
      else toast(t("errNet"));
    }catch(e){ toast(t("errNet")); }
    $("go").disabled = false;
  };

  async function load(){
    try{
      const r = await fetch(API+"/api/config",{cache:"no-store"});
      C = await r.json();
      if(selDay && !C.days.find(d=>d.date===selDay)) selDay=null;
    }catch(e){ toast(t("errNet")); }
    renderAll();
  }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });

  // ---------- экран после оплаты ----------
  const q = new URLSearchParams(location.search);
  if(q.get("paid")==="1"){
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:20;background:var(--night);color:var(--cream);display:grid;place-items:center;padding:24px;text-align:center";
    const slot=(q.get("slot")||"").replace(/[<>&"']/g,"");
    ov.innerHTML=`<div><div style="font-size:56px">🎄</div><h1 class="serif" style="font-style:italic;font-size:30px;margin:10px 0" id="pt"></h1>
      <p style="font-weight:600;margin:0 0 8px;color:var(--gold)">${slot}</p><p style="opacity:.85;max-width:340px;margin:0 auto 20px" id="pp"></p>
      <button class="btn" style="position:static" id="pc"></button></div>`;
    document.body.appendChild(ov);
    $("pt").textContent=t("paidTitle"); $("pp").textContent=t("paidText"); $("pc").textContent=t("paidClose");
    $("pc").onclick=()=>{ ov.remove(); history.replaceState(null,"",location.pathname); };
  }

  // ---------- карусель фотографий (список в config.js → photos) ----------
  (function carousel(){
    const list=(window.BOOKING.photos||[]).filter(Boolean); if(!list.length) return;
    const html=list.map(f=>`<img src="photos/${encodeURI(f)}" alt="" loading="lazy" decoding="async" draggable="false">`).join("");
    $("track").innerHTML=html+html;                       // дважды — для бесконечной прокрутки
    $("track").style.setProperty("--dur",Math.max(20,list.length*6)+"s");
    $("gallery").hidden=false;
  })();

  // ---------- гирлянда и снег ----------
  $("garland").innerHTML = Array.from({length:16},()=>'<i class="bulb"></i>').join("");
  (function snow(){
    const cv=$("snow"), ctx=cv.getContext("2d"); if(!ctx||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let w,h,flakes=[]; const dpr=Math.min(devicePixelRatio||1,2);
    function size(){ const r=cv.parentElement.getBoundingClientRect(); w=r.width;h=r.height;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
      flakes=Array.from({length:Math.round(w/9)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.2+.6,v:Math.random()*.6+.25,d:Math.random()*Math.PI*2})); }
    size(); addEventListener("resize",size);
    (function tick(){
      ctx.clearRect(0,0,w,h); ctx.fillStyle="rgba(255,255,255,.85)";
      for(const f of flakes){ f.y+=f.v; f.d+=.01; f.x+=Math.sin(f.d)*.35; if(f.y>h+4){f.y=-4;f.x=Math.random()*w}
        ctx.globalAlpha=Math.min(1,f.r/2.2+.25); ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.283); ctx.fill(); }
      requestAnimationFrame(tick);
    })();
  })();

  renderAll(); load();
})();
</script>
</body>
</html>
